<body>
<div id="login" class="login-screen" hidden><div class="login-brand"><span class="brand-symbol">✧</span><p class="eyebrow">产业情报</p><h1>把产业信号，<br>变成下一次机会。</h1><p>自定义订阅 · 智能推荐 · 客户跟进<br>持续采集公开招采信息，找到值得跟进的客户。</p><div class="login-lines" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div><form id="login-form" class="login-card"><p class="eyebrow">商机情报工作台</p><h2>欢迎回来</h2><p class="muted">使用账号与密码，进入AI智能获客工作台。</p><label for="username">账号</label><input id="username" autocomplete="username" minlength="3" maxlength="40" required autofocus><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">进入工作台 <span>→</span></button><p id="login-error" class="error-text" role="alert"></p><p class="muted">账号由超级管理员开通。忘记密码请联系管理员重置。</p></form></div>
<div id="shell" class="shell" hidden>
<aside class="sidebar"><a class="brand" href="#today" data-view="today"><span class="brand-symbol ai-logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 3L20 12L29 16L20 20L16 29L12 20L3 16L12 12Z" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="3" fill="currentColor"/></svg></span><span>AI智能获客工作台<small>发现机会 · 连接客户</small></span></a><p class="nav-label">工作空间</p><nav aria-label="主导航"><button data-view="today" class="nav-item active"><span>◈</span> 今日资讯</button><button data-view="pushes" class="nav-item"><span>↗</span> 推送列表</button><button data-view="followups" class="nav-item"><span>✎</span> 我的跟进 <strong id="assignment-badge" class="assignment-count" hidden></strong></button><p class="nav-label" id="management-nav-label">系统管理</p><button data-view="team-dashboard" class="nav-item" data-admin><span>▦</span> 团队看板</button><button data-view="configuration" class="nav-item"><span>⚙</span> 系统配置</button><button data-view="sources" class="nav-item" data-regular hidden><span>◎</span> 监测网站</button><button data-view="sources" class="nav-item" data-admin><span>◎</span> 监测网站</button><button data-view="settings" class="nav-item" data-admin><span>≡</span> 推荐策略</button><button data-view="model" class="nav-item" data-admin><span>✧</span> 智能化配置</button><button data-view="account" class="nav-item"><span>♙</span> 账号配置</button></nav></aside>
<main><header class="topbar"><span class="breadcrumb">工作空间 <span>/</span> <strong id="breadcrumb">商机推荐</strong></span><div class="top-actions"><span id="today"></span><button id="open-notifications" type="button" class="text-button notification-button">通知 <strong id="notification-badge" class="assignment-count" hidden></strong></button><div class="account-control"><button id="account-menu" class="account-chip" aria-label="账号菜单" aria-expanded="false" aria-controls="account-dropdown"><span id="avatar" class="avatar" aria-hidden="true">用</span><span id="identity" class="identity"></span><span aria-hidden="true">⌄</span></button><div id="account-dropdown" class="account-dropdown" hidden><button type="button" data-view="account" data-account-tab="profile">账号详情</button><button type="button" id="logout">退出登录</button></div></div></div></header><div class="page"><div class="page-heading"><div><div class="page-title-line"><h1 id="page-title">发现值得跟进的机会</h1><div id="today-collection-status" hidden></div></div><p id="page-description">从公开招采信息中，筛选与你的业务相关的产业信号。</p></div><div class="heading-actions"><button id="refresh-view" class="secondary" type="button">刷新列表</button><button id="collect" class="text-button" type="button">手动采集</button></div></div><div id="content" aria-live="polite"></div></div><footer>公开信息辅助研判 · 以招采原文及发布单位确认为准</footer></main>
</div>
